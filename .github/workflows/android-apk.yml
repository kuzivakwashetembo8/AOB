name: Build P.O.I Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/gtd-gameplay-analytics-reliability-2026-11-15
    paths:
      - "package.json"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: poi-android-apk-main
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install pinned npm
        run: npm install --global npm@11.6.2

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build offline-ready P.O.I web runtime
        env:
          VERCEL: "1"
          NITRO_PRESET: vercel
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Prepare and verify complete offline Android web bundle
        run: npm run android:prepare

      - name: Generate Android project when absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Verify generated Android package identity and version
        run: npm run android:configure

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poi-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
